spring:
  application:
    name: mcp-tool-service

  datasource:
    # Dynamically anchors the database file to the OS user home directory
    # Appending ?journal_mode=WAL unlocks concurrent reads while writing
    url: jdbc:sqlite:${user.home}/search_engine.db?journal_mode=WAL
    driver-class-name: org.sqlite.JDBC

    # HikariCP Configuration (Spring Boot's built-in default pool)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      # Passes the requirement down to the Xerial driver to allow loading C binaries
      data-source-properties:
        enable_load_extension: true

  # Activates Project Loom Virtual Threads for high-throughput blocking I/O
  threads:
    virtual:
      enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.data.jdbc.autoconfigure.DataJdbcRepositoriesAutoConfiguration

  sql:
    init:
      mode: always # Automatically runs src/main/resources/schema.sql on startup